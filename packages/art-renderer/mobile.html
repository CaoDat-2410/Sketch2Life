<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Sketch2Life — Pixi original-art reveal</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #101827; color: #234134; }
      * { box-sizing: border-box; }
      html, body, main { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: radial-gradient(circle at 50% 45%, #253753 0%, #101827 74%); }
      main { display: flex; align-items: center; justify-content: center; }
      #stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; border: 0; border-radius: 0; background: radial-gradient(circle at 50% 45%, #fffef9 0%, #eef7ff 100%); }
      #stage canvas { position: relative; z-index: 1; display: block; width: 100% !important; height: 100% !important; object-fit: contain; touch-action: none; }
      #stage::before, #stage::after { content: ''; position: absolute; z-index: 2; inset: 7%; pointer-events: none; border-radius: 26px; opacity: .75; }
      #stage::before { background: radial-gradient(circle at 8% 24%, #fde68a 0 5px, transparent 6px), radial-gradient(circle at 92% 20%, #93c5fd 0 6px, transparent 7px), radial-gradient(circle at 86% 82%, #f9a8d4 0 5px, transparent 6px), radial-gradient(circle at 12% 78%, #86efac 0 6px, transparent 7px); animation: story-sparkle 3.6s ease-in-out infinite alternate; }
      #stage::after { border: 2px solid rgba(96,165,250,.4); animation: story-focus 4.2s ease-in-out infinite; }
      @keyframes story-sparkle { from { transform: translate3d(-5px, 3px, 0) scale(.98); opacity: .48; } to { transform: translate3d(7px, -4px, 0) scale(1.03); opacity: .9; } }
      @keyframes story-focus { 0%, 100% { transform: scale(.96); opacity: .2; } 50% { transform: scale(1.02); opacity: .65; } }
      @media (prefers-reduced-motion: reduce) { #stage::before, #stage::after { animation: none; } }
      #status { position: absolute; z-index: 4; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: min(86vw, 620px); padding: 9px 14px; border: 1px solid rgba(147,197,253,.7); border-radius: 16px; background: rgba(15,23,42,.82); color: #fff; font-size: 14px; font-weight: 800; text-align: center; box-shadow: 0 8px 24px rgba(15,23,42,.24); pointer-events: none; }
      button, small { display: none; }
    </style>
  </head>
  <body>
    <main>
      <div id="status" role="status" aria-live="polite">Khởi động PixiJS…</div>
      <div id="stage" aria-label="Bức vẽ gốc được giữ nguyên"></div>
      <button id="play" type="button" disabled>Đang kết nối renderer…</button>
      <small>Ảnh gốc được giữ nguyên trong một intro chuyển động ngắn; không sinh ảnh hay video thay thế.</small>
    </main>
    <script type="module" src="./demo/mobile.ts"></script>
  </body>
</html>
