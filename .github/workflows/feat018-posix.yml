name: feat018-posix

# Approved scope: features/FEAT-018-live-image-canvas-flow/approvals/TASK_APPROVAL.md
# "Approved FEAT-018 POSIX CI workflow — 2026-09-16". This workflow runs only the
# synthetic FEAT-018 POSIX process-group cleanup test on Ubuntu/Linux. It performs
# no Lightning, GPU, model, provider, network, or live benchmark activity, and it
# is not authorized to build, deploy, merge, or otherwise cut over anything.

on:
  push:
    branches:
      - feature/feat018-p2t2-live-lightning
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: feat018-posix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  posix-cleanup-test:
    name: FEAT-018 POSIX process-group cleanup test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install existing backend project (dev extras only)
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the approved POSIX process-group cleanup test
        working-directory: backend
        run: |
          set -euo pipefail
          pytest \
            "tests/unit/test_feat018_live_lightning_execution.py::TestPosixContainmentRealProcessGroupEscalation::test_real_process_group_sigterm_ignored_then_sigkilled_leaves_no_orphan" \
            -v \
            --junitxml=feat018-posix-junit.xml \
            2>&1 | tee feat018-posix-pytest.log

      - name: Fail if the approved test was skipped, deselected, or missing
        if: always()
        working-directory: backend
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = "feat018-posix-junit.xml"
          try:
              tree = ET.parse(path)
          except FileNotFoundError:
              print(f"No JUnit report at {path}; the approved test did not run.")
              sys.exit(1)

          root = tree.getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          if suite is None:
              print("No <testsuite> element found in the JUnit report.")
              sys.exit(1)

          tests = int(suite.get("tests", "0"))
          skipped = int(suite.get("skipped", "0"))
          errors = int(suite.get("errors", "0"))
          failures = int(suite.get("failures", "0"))

          if tests != 1:
              print(f"Expected exactly 1 collected test node, found {tests}.")
              sys.exit(1)
          if skipped != 0:
              print(
                  "The approved POSIX process-group cleanup test was skipped; "
                  "this workflow requires it to actually run on Ubuntu/Linux."
              )
              sys.exit(1)
          if errors != 0 or failures != 0:
              print("The approved POSIX process-group cleanup test failed.")
              sys.exit(1)

          print("Approved FEAT-018 POSIX process-group cleanup test passed and was not skipped.")
          PY

      - name: Upload bounded test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feat018-posix-test-logs
          path: |
            backend/feat018-posix-junit.xml
            backend/feat018-posix-pytest.log
          retention-days: 14
          if-no-files-found: warn
