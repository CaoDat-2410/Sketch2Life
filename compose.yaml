name: sketch2life

services:
  email-worker:
    image: sketch2life-api:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["email"]
    working_dir: /workspace/backend
    command: ["python", "-m", "sketch2life.infrastructure.platform_admin.email_worker", "--loop"]
    environment:
      PYTHONPATH: /workspace/backend/src
    volumes:
      - .:/workspace:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${SKETCH2LIFE_POSTGRES_DB:-sketch2life}
      POSTGRES_USER: ${SKETCH2LIFE_POSTGRES_USER:-sketch2life}
      POSTGRES_PASSWORD: ${SKETCH2LIFE_POSTGRES_PASSWORD:-change-me}
    ports:
      # Port 5432 is commonly occupied by a host PostgreSQL installation.
      # Containers still reach Postgres through postgres:5432 internally.
      - "127.0.0.1:${SKETCH2LIFE_POSTGRES_PORT:-5433}:5432"
    volumes:
      - sketch2life-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - sketch2life-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # The old Quay tag is no longer pullable. This arm64-compatible legacy
    # image is available for local development on Apple Silicon.
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: ${SKETCH2LIFE_S3_ACCESS_KEY:-local-minio-user}
      MINIO_ROOT_PASSWORD: ${SKETCH2LIFE_S3_SECRET_KEY:-change-this-local-minio-secret}
      MINIO_BROWSER: "on"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - sketch2life-minio:/bitnami/minio/data

  minio-init:
    image: bitnamilegacy/minio-client:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null 2>&1; do
          sleep 2;
        done;
        mc mb --ignore-existing "local/$${SKETCH2LIFE_S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${SKETCH2LIFE_S3_ACCESS_KEY:-local-minio-user}
      MINIO_ROOT_PASSWORD: ${SKETCH2LIFE_S3_SECRET_KEY:-change-this-local-minio-secret}
      SKETCH2LIFE_S3_BUCKET: ${SKETCH2LIFE_S3_BUCKET:-sketch2life-private}
    depends_on:
      minio:
        condition: service_started
    restart: "no"

  clamav:
    image: clamav/clamav:1.5.4
    # ClamAV does not publish an arm64 image yet; Docker Desktop emulates
    # this service on Apple Silicon while the rest of the stack stays native.
    platform: linux/amd64
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - sketch2life-clamav-database:/var/lib/clamav
    restart: unless-stopped
    # ClamAV's official image needs several GiB of memory for signature databases.
    mem_limit: 4g

  # One-shot local bootstrap: migrates a fresh database (live Parent line only) and seeds the demo
  # Parent identity from .env. `docker compose up -d` runs it before the api starts.
  bootstrap:
    # Every variable in the repo-root .env reaches the container. Entries under `environment:` win
    # over .env, so container-internal values (database host, port, ...) are never overridden.
    env_file:
      - path: .env
        required: false
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "sketch2life.infrastructure.local_bootstrap"]
    environment:
      SKETCH2LIFE_ENV: local
      SKETCH2LIFE_DATABASE_URL: postgresql+psycopg://${SKETCH2LIFE_POSTGRES_USER:-sketch2life}:${SKETCH2LIFE_POSTGRES_PASSWORD:-change-me}@postgres:5432/${SKETCH2LIFE_POSTGRES_DB:-sketch2life}
      SKETCH2LIFE_LOCAL_SEED_PARENT_EMAIL: ${SKETCH2LIFE_LOCAL_SEED_PARENT_EMAIL:-}
      SKETCH2LIFE_LOCAL_SEED_PARENT_PASSWORD: ${SKETCH2LIFE_LOCAL_SEED_PARENT_PASSWORD:-}
      SKETCH2LIFE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
      SKETCH2LIFE_FIREBASE_PROJECT_ID: ${SKETCH2LIFE_FIREBASE_PROJECT_ID:-${VITE_FIREBASE_PROJECT_ID:-}}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    # Every variable in the repo-root .env reaches the container. Entries under `environment:` win
    # over .env, so container-internal values (database host, port, ...) are never overridden.
    env_file:
      - path: .env
        required: false
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SKETCH2LIFE_ENV: local
      SKETCH2LIFE_API_HOST: 0.0.0.0
      SKETCH2LIFE_BILLING_SANDBOX_ENABLED: ${SKETCH2LIFE_BILLING_SANDBOX_ENABLED:-false}
      SKETCH2LIFE_BILLING_REAL_PAYMENTS_ENABLED: ${SKETCH2LIFE_BILLING_REAL_PAYMENTS_ENABLED:-false}
      SKETCH2LIFE_MOMO_PARTNER_CODE: ${SKETCH2LIFE_MOMO_PARTNER_CODE:-}
      SKETCH2LIFE_MOMO_ACCESS_KEY: ${SKETCH2LIFE_MOMO_ACCESS_KEY:-}
      SKETCH2LIFE_MOMO_SECRET_KEY: ${SKETCH2LIFE_MOMO_SECRET_KEY:-}
      SKETCH2LIFE_MOMO_PARTNER_NAME: ${SKETCH2LIFE_MOMO_PARTNER_NAME:-Sketch2Life}
      SKETCH2LIFE_MOMO_ENDPOINT: ${SKETCH2LIFE_MOMO_ENDPOINT:-https://test-payment.momo.vn/v2/gateway/api/create}
      SKETCH2LIFE_MOMO_RETURN_URL: ${SKETCH2LIFE_MOMO_RETURN_URL:-}
      SKETCH2LIFE_MOMO_IPN_URL: ${SKETCH2LIFE_MOMO_IPN_URL:-}
      SKETCH2LIFE_VNPAY_TMN_CODE: ${SKETCH2LIFE_VNPAY_TMN_CODE:-}
      SKETCH2LIFE_VNPAY_HASH_SECRET: ${SKETCH2LIFE_VNPAY_HASH_SECRET:-}
      SKETCH2LIFE_VNPAY_PAYMENT_URL: ${SKETCH2LIFE_VNPAY_PAYMENT_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      SKETCH2LIFE_VNPAY_QUERY_URL: ${SKETCH2LIFE_VNPAY_QUERY_URL:-https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      SKETCH2LIFE_VNPAY_SERVER_IP: ${SKETCH2LIFE_VNPAY_SERVER_IP:-}
      SKETCH2LIFE_VNPAY_RETURN_URL: ${SKETCH2LIFE_VNPAY_RETURN_URL:-}
      SKETCH2LIFE_VNPAY_IPN_URL: ${SKETCH2LIFE_VNPAY_IPN_URL:-}
      SKETCH2LIFE_BILLING_PROVIDER_TIMEOUT_SECONDS: ${SKETCH2LIFE_BILLING_PROVIDER_TIMEOUT_SECONDS:-35}
      SKETCH2LIFE_SMTP_HOST: ${SKETCH2LIFE_SMTP_HOST:-}
      SKETCH2LIFE_SMTP_PORT: ${SKETCH2LIFE_SMTP_PORT:-587}
      SKETCH2LIFE_SMTP_FROM: ${SKETCH2LIFE_SMTP_FROM:-}
      SKETCH2LIFE_SMTP_STARTTLS: ${SKETCH2LIFE_SMTP_STARTTLS:-true}
      SKETCH2LIFE_SMTP_USERNAME: ${SKETCH2LIFE_SMTP_USERNAME:-}
      SKETCH2LIFE_SMTP_PASSWORD: ${SKETCH2LIFE_SMTP_PASSWORD:-}
      SKETCH2LIFE_API_PORT: 8000
      SKETCH2LIFE_DATABASE_URL: postgresql+psycopg://${SKETCH2LIFE_POSTGRES_USER:-sketch2life}:${SKETCH2LIFE_POSTGRES_PASSWORD:-change-me}@postgres:5432/${SKETCH2LIFE_POSTGRES_DB:-sketch2life}
      SKETCH2LIFE_REDIS_URL: redis://redis:6379/0
      SKETCH2LIFE_S3_ENDPOINT: ${SKETCH2LIFE_S3_ENDPOINT-http://minio:9000}
      SKETCH2LIFE_S3_REGION: ${SKETCH2LIFE_S3_REGION:-us-east-1}
      SKETCH2LIFE_S3_BUCKET: ${SKETCH2LIFE_S3_BUCKET:-sketch2life-private}
      SKETCH2LIFE_S3_ACCESS_KEY: ${SKETCH2LIFE_S3_ACCESS_KEY:-local-minio-user}
      SKETCH2LIFE_S3_SECRET_KEY: ${SKETCH2LIFE_S3_SECRET_KEY:-change-this-local-minio-secret}
      SKETCH2LIFE_STORAGE_EXAMPLE_ENABLED: ${SKETCH2LIFE_STORAGE_EXAMPLE_ENABLED:-true}
      SKETCH2LIFE_STORAGE_EXAMPLE_MAX_UPLOAD_BYTES: ${SKETCH2LIFE_STORAGE_EXAMPLE_MAX_UPLOAD_BYTES:-10485760}
      SKETCH2LIFE_CLAMAV_HOST: clamav
      SKETCH2LIFE_CLAMAV_PORT: 3310
      SKETCH2LIFE_PLATFORM_ADMIN_BOOTSTRAP_EMAIL: ${SKETCH2LIFE_PLATFORM_ADMIN_BOOTSTRAP_EMAIL:-}
      SKETCH2LIFE_AUTH_PROVIDER: ${SKETCH2LIFE_AUTH_PROVIDER:-development}
      SKETCH2LIFE_SYNTHETIC_PILOT_ENABLED: ${SKETCH2LIFE_SYNTHETIC_PILOT_ENABLED:-false}
      SKETCH2LIFE_FIREBASE_PROJECT_ID: ${SKETCH2LIFE_FIREBASE_PROJECT_ID:-}
      SKETCH2LIFE_FIREBASE_ADMIN_JSON_BASE64: ${SKETCH2LIFE_FIREBASE_ADMIN_JSON_BASE64:-}
      SKETCH2LIFE_FIREBASE_CHECK_REVOKED_TOKENS: ${SKETCH2LIFE_FIREBASE_CHECK_REVOKED_TOKENS:-true}
      SKETCH2LIFE_AI_PROVIDER: ${SKETCH2LIFE_AI_PROVIDER:-disabled}
      SKETCH2LIFE_STORY_VIDEO_ADAPTERS: ${SKETCH2LIFE_STORY_VIDEO_ADAPTERS:-unconfigured}
      # FEAT-094 S6: start the video GPU while the adult reviews the story.
      SKETCH2LIFE_STORY_VIDEO_WARM_UP: ${SKETCH2LIFE_STORY_VIDEO_WARM_UP:-true}
      # FEAT-094 phase 4: the Parent story is a learning script that the video speaks as written.
      SKETCH2LIFE_STORY_LEARNING: ${SKETCH2LIFE_STORY_LEARNING:-true}
      SKETCH2LIFE_OPS_PROBE_TOKEN: ${SKETCH2LIFE_OPS_PROBE_TOKEN:-}
      MODAL_TOKEN_ID: ${MODAL_TOKEN_ID:-}
      MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET:-}
    ports:
      - "127.0.0.1:${SKETCH2LIFE_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_started
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # The periodic story sweep (FEAT-066 T-1d1-fix): lost-task reaper, admission reconciler and the
  # adult-wait closeout. Off by default: start it with `docker compose --profile sweeper up`.
  story-sweeper:
    profiles: ["sweeper"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      [
        "python",
        "-m",
        "sketch2life.infrastructure.story_video.sweep_worker",
        "--heartbeat-file",
        "/tmp/story-sweep-heartbeat",
      ]
    environment:
      SKETCH2LIFE_ENV: local
      SKETCH2LIFE_DATABASE_URL: postgresql+psycopg://${SKETCH2LIFE_POSTGRES_USER:-sketch2life}:${SKETCH2LIFE_POSTGRES_PASSWORD:-change-me}@postgres:5432/${SKETCH2LIFE_POSTGRES_DB:-sketch2life}
      SKETCH2LIFE_STORY_SWEEP_ENABLED: ${SKETCH2LIFE_STORY_SWEEP_ENABLED:-true}
      SKETCH2LIFE_STORY_SWEEP_INTERVAL_SECONDS: ${SKETCH2LIFE_STORY_SWEEP_INTERVAL_SECONDS:-300}
      SKETCH2LIFE_STORY_SWEEP_BATCH_SIZE: ${SKETCH2LIFE_STORY_SWEEP_BATCH_SIZE:-50}
      SKETCH2LIFE_STORY_SWEEP_TASK_LEASE_SECONDS: ${SKETCH2LIFE_STORY_SWEEP_TASK_LEASE_SECONDS:-21600}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Alive means a pass with no failing step (or one that found the lock busy) finished within
      # three intervals plus two minutes; the limit follows the configured interval (up to 3600 s).
      test:
        ["CMD", "python", "-c", "import os, sys, time; limit = 3 * float(os.environ.get('SKETCH2LIFE_STORY_SWEEP_INTERVAL_SECONDS', '300')) + 120; sys.exit(0 if time.time() - os.path.getmtime('/tmp/story-sweep-heartbeat') < limit else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  # FEAT-093: the Parent video worker. Off by default: `docker compose --profile video up video-worker`.
  # It is the only service that holds Modal credentials for video (C1 renders scenes, C2 prepares and narrates).
  video-worker:
    profiles: ["video"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "sketch2life.infrastructure.story_video.video_worker"]
    environment:
      SKETCH2LIFE_ENV: local
      SKETCH2LIFE_DATABASE_URL: postgresql+psycopg://${SKETCH2LIFE_POSTGRES_USER:-sketch2life}:${SKETCH2LIFE_POSTGRES_PASSWORD:-change-me}@postgres:5432/${SKETCH2LIFE_POSTGRES_DB:-sketch2life}
      SKETCH2LIFE_STORY_VIDEO_RENDERER: ${SKETCH2LIFE_STORY_VIDEO_RENDERER:-modal_dev}
      SKETCH2LIFE_STORY_VIDEO_SCENE_CHECK: ${SKETCH2LIFE_STORY_VIDEO_SCENE_CHECK:-report}
      SKETCH2LIFE_STORY_VIDEO_ADAPTERS: ${SKETCH2LIFE_STORY_VIDEO_ADAPTERS:-local_test}
      SKETCH2LIFE_S3_ENDPOINT: ${SKETCH2LIFE_S3_ENDPOINT-http://minio:9000}
      SKETCH2LIFE_S3_REGION: ${SKETCH2LIFE_S3_REGION:-us-east-1}
      SKETCH2LIFE_S3_BUCKET: ${SKETCH2LIFE_S3_BUCKET:-sketch2life-private}
      SKETCH2LIFE_S3_ACCESS_KEY: ${SKETCH2LIFE_S3_ACCESS_KEY:-local-minio-user}
      SKETCH2LIFE_S3_SECRET_KEY: ${SKETCH2LIFE_S3_SECRET_KEY:-change-this-local-minio-secret}
      MODAL_TOKEN_ID: ${MODAL_TOKEN_ID:-}
      MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

volumes:
  sketch2life-postgres:
  sketch2life-redis:
  sketch2life-minio:
  sketch2life-clamav-database:
