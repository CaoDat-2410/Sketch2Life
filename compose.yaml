name: sketch2life

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${SKETCH2LIFE_POSTGRES_DB:-sketch2life}
      POSTGRES_USER: ${SKETCH2LIFE_POSTGRES_USER:-sketch2life}
      POSTGRES_PASSWORD: ${SKETCH2LIFE_POSTGRES_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:${SKETCH2LIFE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - sketch2life-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:${SKETCH2LIFE_REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - sketch2life-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    build:
      context: .
      dockerfile: deployment/minio/Dockerfile
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SKETCH2LIFE_S3_ACCESS_KEY:-local-minio-user}
      MINIO_ROOT_PASSWORD: ${SKETCH2LIFE_S3_SECRET_KEY:-change-this-local-minio-secret}
    ports:
      - "127.0.0.1:${SKETCH2LIFE_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${SKETCH2LIFE_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - sketch2life-minio:/data

  minio-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "sketch2life.infrastructure.storage.ensure_local_bucket"]
    environment:
      SKETCH2LIFE_ENV: local
      SKETCH2LIFE_S3_ENDPOINT: http://minio:9000
      SKETCH2LIFE_S3_REGION: ${SKETCH2LIFE_S3_REGION:-us-east-1}
      SKETCH2LIFE_S3_BUCKET: ${SKETCH2LIFE_S3_BUCKET:-sketch2life-private}
      SKETCH2LIFE_S3_ACCESS_KEY: ${SKETCH2LIFE_S3_ACCESS_KEY:-local-minio-user}
      SKETCH2LIFE_S3_SECRET_KEY: ${SKETCH2LIFE_S3_SECRET_KEY:-change-this-local-minio-secret}
    depends_on:
      minio:
        condition: service_started
    restart: "no"

  clamav:
    image: clamav/clamav:1.5.4
    ports:
      - "127.0.0.1:${SKETCH2LIFE_CLAMAV_PORT:-3310}:3310"
    volumes:
      - sketch2life-clamav-database:/var/lib/clamav
    restart: unless-stopped
    # ClamAV's official image needs several GiB of memory for signature databases.
    mem_limit: 4g

  firebase-auth:
    build:
      context: .
      dockerfile: deployment/firebase-auth/Dockerfile
    environment:
      SKETCH2LIFE_FIREBASE_PROJECT_ID: ${SKETCH2LIFE_FIREBASE_PROJECT_ID:-${VITE_FIREBASE_PROJECT_ID:-sketch2life-local}}
    ports:
      - "127.0.0.1:${SKETCH2LIFE_FIREBASE_AUTH_PORT:-9099}:9099"
    volumes:
      - sketch2life-firebase-auth:/data
      - sketch2life-firebase-cache:/root/.cache/firebase/emulators
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9099/').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["alembic", "upgrade", "heads"]
    environment:
      SKETCH2LIFE_DATABASE_URL: postgresql+psycopg://${SKETCH2LIFE_POSTGRES_USER:-sketch2life}:${SKETCH2LIFE_POSTGRES_PASSWORD:-change-me}@postgres:5432/${SKETCH2LIFE_POSTGRES_DB:-sketch2life}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed-parent-demo:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "sketch2life.infrastructure.local_demo.parent_seed"]
    environment:
      SKETCH2LIFE_ENV: local
      SKETCH2LIFE_DATABASE_URL: postgresql+psycopg://${SKETCH2LIFE_POSTGRES_USER:-sketch2life}:${SKETCH2LIFE_POSTGRES_PASSWORD:-change-me}@postgres:5432/${SKETCH2LIFE_POSTGRES_DB:-sketch2life}
      SKETCH2LIFE_AUTH_PROVIDER: ${SKETCH2LIFE_AUTH_PROVIDER:-firebase}
      SKETCH2LIFE_FIREBASE_PROJECT_ID: ${SKETCH2LIFE_FIREBASE_PROJECT_ID:-${VITE_FIREBASE_PROJECT_ID:-sketch2life-local}}
      SKETCH2LIFE_FIREBASE_ADMIN_JSON_BASE64: ${SKETCH2LIFE_FIREBASE_ADMIN_JSON_BASE64:-}
      FIREBASE_AUTH_EMULATOR_HOST: firebase-auth:9099
      SKETCH2LIFE_LOCAL_SEED_PARENT_EMAIL: ${SKETCH2LIFE_LOCAL_SEED_PARENT_EMAIL:-}
      SKETCH2LIFE_LOCAL_SEED_PARENT_PASSWORD: ${SKETCH2LIFE_LOCAL_SEED_PARENT_PASSWORD:-}
      SKETCH2LIFE_PARENT_CONSENT_POLICY_VERSION: ${SKETCH2LIFE_PARENT_CONSENT_POLICY_VERSION:-local-synthetic-demo-v1}
      SKETCH2LIFE_PARENT_CONSENT_POLICY_TEXT: ${SKETCH2LIFE_PARENT_CONSENT_POLICY_TEXT:-Local synthetic development notice. No real child data is used.}
    depends_on:
      postgres:
        condition: service_healthy
      firebase-auth:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  seed-teacher-demo:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "sketch2life.infrastructure.local_demo.teacher_seed"]
    environment:
      SKETCH2LIFE_ENV: local
      SKETCH2LIFE_DATABASE_URL: postgresql+psycopg://${SKETCH2LIFE_POSTGRES_USER:-sketch2life}:${SKETCH2LIFE_POSTGRES_PASSWORD:-change-me}@postgres:5432/${SKETCH2LIFE_POSTGRES_DB:-sketch2life}
      SKETCH2LIFE_AUTH_PROVIDER: ${SKETCH2LIFE_AUTH_PROVIDER:-firebase}
      SKETCH2LIFE_FIREBASE_PROJECT_ID: ${SKETCH2LIFE_FIREBASE_PROJECT_ID:-${VITE_FIREBASE_PROJECT_ID:-sketch2life-local}}
      SKETCH2LIFE_FIREBASE_ADMIN_JSON_BASE64: ${SKETCH2LIFE_FIREBASE_ADMIN_JSON_BASE64:-}
      FIREBASE_AUTH_EMULATOR_HOST: firebase-auth:9099
      SKETCH2LIFE_LOCAL_SEED_TEACHER_EMAIL: ${SKETCH2LIFE_LOCAL_SEED_TEACHER_EMAIL:-}
      SKETCH2LIFE_LOCAL_SEED_TEACHER_PASSWORD: ${SKETCH2LIFE_LOCAL_SEED_TEACHER_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      firebase-auth:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed-parent-demo:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SKETCH2LIFE_ENV: local
      SKETCH2LIFE_SYNTHETIC_PILOT_ENABLED: "true"
      SKETCH2LIFE_API_HOST: 0.0.0.0
      SKETCH2LIFE_API_PORT: 8000
      SKETCH2LIFE_DATABASE_URL: postgresql+psycopg://${SKETCH2LIFE_POSTGRES_USER:-sketch2life}:${SKETCH2LIFE_POSTGRES_PASSWORD:-change-me}@postgres:5432/${SKETCH2LIFE_POSTGRES_DB:-sketch2life}
      SKETCH2LIFE_S3_ENDPOINT: ${SKETCH2LIFE_S3_ENDPOINT-http://minio:9000}
      SKETCH2LIFE_S3_REGION: ${SKETCH2LIFE_S3_REGION:-us-east-1}
      SKETCH2LIFE_S3_BUCKET: ${SKETCH2LIFE_S3_BUCKET:-sketch2life-private}
      SKETCH2LIFE_S3_ACCESS_KEY: ${SKETCH2LIFE_S3_ACCESS_KEY:-local-minio-user}
      SKETCH2LIFE_S3_SECRET_KEY: ${SKETCH2LIFE_S3_SECRET_KEY:-change-this-local-minio-secret}
      SKETCH2LIFE_STORAGE_EXAMPLE_ENABLED: ${SKETCH2LIFE_STORAGE_EXAMPLE_ENABLED:-true}
      SKETCH2LIFE_STORAGE_EXAMPLE_MAX_UPLOAD_BYTES: ${SKETCH2LIFE_STORAGE_EXAMPLE_MAX_UPLOAD_BYTES:-10485760}
      SKETCH2LIFE_CLAMAV_HOST: clamav
      SKETCH2LIFE_CLAMAV_PORT: 3310
      SKETCH2LIFE_PLATFORM_ADMIN_BOOTSTRAP_EMAIL: ${SKETCH2LIFE_PLATFORM_ADMIN_BOOTSTRAP_EMAIL:-}
      SKETCH2LIFE_AUTH_PROVIDER: ${SKETCH2LIFE_AUTH_PROVIDER:-firebase}
      SKETCH2LIFE_FIREBASE_PROJECT_ID: ${SKETCH2LIFE_FIREBASE_PROJECT_ID:-${VITE_FIREBASE_PROJECT_ID:-sketch2life-local}}
      SKETCH2LIFE_FIREBASE_ADMIN_JSON_BASE64: ${SKETCH2LIFE_FIREBASE_ADMIN_JSON_BASE64:-}
      FIREBASE_AUTH_EMULATOR_HOST: firebase-auth:9099
      SKETCH2LIFE_FIREBASE_CHECK_REVOKED_TOKENS: ${SKETCH2LIFE_FIREBASE_CHECK_REVOKED_TOKENS:-true}
      SKETCH2LIFE_PARENT_CONSENT_POLICY_VERSION: ${SKETCH2LIFE_PARENT_CONSENT_POLICY_VERSION:-local-synthetic-demo-v1}
      SKETCH2LIFE_PARENT_CONSENT_POLICY_TEXT: ${SKETCH2LIFE_PARENT_CONSENT_POLICY_TEXT:-Local synthetic development notice. No real child data is used.}
      SKETCH2LIFE_LOCAL_DEMO_PARENT_VIDEO_QUOTA_GRANTED: ${SKETCH2LIFE_LOCAL_DEMO_PARENT_VIDEO_QUOTA_GRANTED:-5}
      SKETCH2LIFE_LOCAL_DEMO_PARENT_VIDEO_QUOTA_USED: ${SKETCH2LIFE_LOCAL_DEMO_PARENT_VIDEO_QUOTA_USED:-0}
      SKETCH2LIFE_AI_PROVIDER: ${SKETCH2LIFE_AI_PROVIDER:-modal_dev}
      SKETCH2LIFE_SVG_ILLUSTRATION_GENERATION_ENABLED: ${SKETCH2LIFE_SVG_ILLUSTRATION_GENERATION_ENABLED:-false}
      SKETCH2LIFE_SVG_TOPIC_STROKE_GUIDE_GENERATION_ENABLED: ${SKETCH2LIFE_SVG_TOPIC_STROKE_GUIDE_GENERATION_ENABLED:-false}
      MODAL_TOKEN_ID: ${MODAL_TOKEN_ID:-}
      MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET:-}
    ports:
      - "127.0.0.1:${SKETCH2LIFE_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      seed-parent-demo:
        condition: service_completed_successfully
      seed-teacher-demo:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  modal-health:
    build:
      context: .
      dockerfile: deployment/modal/srs_v23/Dockerfile.health
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-sketch2life}
      SKETCH2LIFE_MODAL_ENVIRONMENT: ${SKETCH2LIFE_MODAL_ENVIRONMENT:-dev}
      MODAL_TOKEN_ID: ${MODAL_TOKEN_ID:-}
      MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET:-}
    healthcheck:
      test: ["CMD", "python", "docker_health_lifecycle.py", "--check"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 11m
    stop_grace_period: 60s
    restart: "no"

volumes:
  sketch2life-postgres:
  sketch2life-redis:
  sketch2life-minio:
  sketch2life-clamav-database:
  sketch2life-firebase-auth:
  sketch2life-firebase-cache:
