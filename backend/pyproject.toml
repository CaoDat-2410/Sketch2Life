[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sketch2life-backend"
version = "0.0.0"
description = "Sketch2Life modular-monolith backend foundation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "boto3>=1.39,<2",
  "fastapi>=0.141,<1",
  "httpx2>=2.10,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=6,<7",
  "rq>=2,<3",
  "sqlalchemy>=2.0,<3",
  "structlog>=25,<26",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]
# P2-T2 Phase B (approved 2026-08-30): exact-pinned, not range-pinned like the rest of this
# file. CTranslate2's cuDNN version requirement has changed across releases (>=4.0 requires
# CUDA 12/cuDNN 9), so a range pin risks silently breaking local GPU compatibility between
# installs. See plan/P2_T2_ASR_RESEARCH_PLAN.md "B6. GPU preflight and dependency pinning"
# and DECISIONS.md. Optional so Sprint 1's other standalone components never require it.
asr-faster-whisper = [
  "faster-whisper==1.2.1",
  "ctranslate2==4.8.1",
]
# P2-T3 Phase B B1: exact pins recorded for the one approved Qwen candidate. This extra is
# intentionally not installed in B1; no model weights or provider runtime are fetched here.
vision-qwen = [
  "accelerate==1.10.1",
  "qwen-vl-utils==0.0.14",
  "torch==2.8.0",
  "transformers==4.57.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sketch2life"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["sketch2life"]

[[tool.mypy.overrides]]
# faster-whisper (P2-T2 Phase B) ships no type stubs/py.typed marker.
module = "faster_whisper.*"
ignore_missing_imports = true
