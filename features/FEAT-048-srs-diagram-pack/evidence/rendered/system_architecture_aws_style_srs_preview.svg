<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1260" viewBox="0 0 1920 1260" role="img" aria-labelledby="title desc">
  <title id="title">Sketch2Life System Architecture — SRS v3.1, AWS-inspired vendor-neutral preview</title>
  <desc id="desc">A vendor-neutral architecture preview showing confirmed client and API technologies, proposed domain groupings, outbound ports, candidate adapters and external capabilities, and a proposed asynchronous AI flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1 1L9 5L1 9Z" fill="#53677e"/></marker>
    <marker id="arrowDashed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1 1L9 5L1 9Z" fill="#9b6c22"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #19283a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #596a7e; }
      .section { font-size: 17px; font-weight: 700; }
      .label { font-size: 14px; font-weight: 700; }
      .body { font-size: 13px; fill: #405268; }
      .small { font-size: 11px; fill: #52647a; }
      .tiny { font-size: 10px; fill: #52647a; }
      .badge { font-size: 10px; font-weight: 700; letter-spacing: .45px; }
      .card { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; }
      .group { fill: #fff; stroke: #c9d3df; stroke-width: 1.5; }
      .flow { fill: none; stroke: #53677e; stroke-width: 2.2; marker-end: url(#arrow); }
      .flowThin { fill: none; stroke: #718196; stroke-width: 1.7; marker-end: url(#arrow); }
      .proposal { fill: none; stroke: #b47a25; stroke-width: 1.8; stroke-dasharray: 7 6; marker-end: url(#arrowDashed); }
      .confirmedBadge { fill: #e5f5ed; stroke: #a9dbc0; }
      .proposedBadge { fill: #fff4dc; stroke: #ebd29a; }
      .tbdBadge { fill: #f1f4f8; stroke: #d3dbe5; }
      .chipText { font-size: 11px; fill: #33475d; }
    </style>
  </defs>

