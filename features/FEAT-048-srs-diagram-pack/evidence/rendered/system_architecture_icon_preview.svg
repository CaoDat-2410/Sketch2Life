  <text x="554" y="1017" class="body">AI provider adapter</text><text x="1310" y="1017" text-anchor="end" class="proposed">PROPOSED</text>
  <rect x="538" y="1040" width="818" height="42" class="soft-box"/>
  <text x="554" y="1066" class="body">Realtime / presence adapter</text><text x="1310" y="1066" text-anchor="end" class="proposed">PROPOSED</text>

  <rect x="1450" y="795" width="332" height="42" class="candidate-box"/><use href="#database" x="1458" y="798" width="36" height="36"/><text x="1502" y="813" class="body">Relational database</text><text x="1502" y="829" class="tiny">vendor TBD</text>
  <rect x="1450" y="844" width="332" height="42" class="candidate-box"/><use href="#object" x="1458" y="847" width="36" height="36"/><text x="1502" y="862" class="body">Object storage</text><text x="1502" y="878" class="tiny">vendor TBD</text>
  <rect x="1450" y="893" width="332" height="42" class="candidate-box"/><use href="#queue" x="1458" y="896" width="36" height="36"/><text x="1502" y="911" class="body">Async job queue</text><text x="1502" y="927" class="tiny">candidate</text>
  <rect x="1450" y="942" width="332" height="42" class="candidate-box"/><use href="#identity" x="1458" y="945" width="36" height="36"/><text x="1502" y="960" class="body">Adult identity service</text><text x="1502" y="976" class="tiny">provider TBD</text>
  <rect x="1450" y="991" width="332" height="42" class="candidate-box"/><use href="#ai" x="1458" y="994" width="36" height="36"/><text x="1502" y="1009" class="body">AI API</text><text x="1502" y="1025" class="tiny">provider / payload TBD</text>
  <rect x="1450" y="1040" width="332" height="42" class="candidate-box"/><use href="#realtime" x="1458" y="1043" width="36" height="36"/><text x="1502" y="1058" class="body">Realtime transport</text><text x="1502" y="1074" class="tiny">proposed · TBD</text>

  <!-- proposed adapter integrations, one row per capability -->
  <path d="M1356 816H1450M1356 865H1450M1356 914H1450M1356 963H1450M1356 1012H1450M1356 1061H1450" class="flow-proposed"/>

  <text x="39" y="1160" class="small">Async candidate path: queue → worker → AI adapter → AI API → job result/status.</text>
  <text x="39" y="1184" class="tiny">Clients never call external providers directly. Exact provider payloads and full production infrastructure remain unresolved in SRS v3.1.</text>
</svg>
