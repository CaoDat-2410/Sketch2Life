    <symbol id="phone" viewBox="0 0 40 48"><rect class="icon-green" x="8" y="3" width="24" height="42" rx="3"/><path class="icon-green" d="M15 8h10M17 39h6"/></symbol>
    <symbol id="monitor" viewBox="0 0 48 40"><rect class="icon" x="3" y="3" width="42" height="27" rx="1"/><path class="icon" d="M18 37h12M24 30v7"/></symbol>
    <symbol id="server" viewBox="0 0 48 48"><rect class="icon-green" x="6" y="6" width="36" height="14" rx="1"/><rect class="icon-green" x="6" y="27" width="36" height="14" rx="1"/><circle cx="13" cy="13" r="1.5" fill="#347253"/><circle cx="13" cy="34" r="1.5" fill="#347253"/><path class="icon-green" d="M19 13h16M19 34h16"/></symbol>
