  <rect x="1000" y="250" width="374" height="334" class="box"/>
  <text x="1020" y="283" class="heading">Domain</text>
  <text x="1080" y="283" class="proposed">9 B8 CONTEXT GROUPINGS · PROPOSED</text>
  <path d="M1192 302V548" class="divider"/>
  <text x="1020" y="326" class="list">Identity / Consent</text>
  <text x="1020" y="368" class="list">Drawing / Collaboration</text>
  <text x="1020" y="410" class="list">Activities</text>
  <text x="1020" y="452" class="list">Classroom</text>
  <text x="1020" y="494" class="list">AI Assistance</text>
  <text x="1208" y="326" class="list">Session / Groups</text>
  <text x="1208" y="368" class="list">Knowledge / Media</text>
  <text x="1208" y="410" class="list">Governance / Audit</text>
  <text x="1208" y="452" class="list">Portfolio / Assessment</text>
  <text x="1020" y="565" class="tiny">Logical boundaries; not a frozen deployment topology.</text>

  <path d="M859 522V590" class="flow"/>
  <rect x="756" y="590" width="618" height="108" class="soft-box"/>
  <use href="#ports" x="773" y="620" width="43" height="43"/>
