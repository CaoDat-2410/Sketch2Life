    <symbol id="database" viewBox="0 0 40 40"><ellipse class="icon-candidate" cx="20" cy="7" rx="14" ry="5"/><path class="icon-candidate" d="M6 7v25c0 3 6 5 14 5s14-2 14-5V7M6 16c0 3 6 5 14 5s14-2 14-5M6 25c0 3 6 5 14 5s14-2 14-5"/></symbol>
