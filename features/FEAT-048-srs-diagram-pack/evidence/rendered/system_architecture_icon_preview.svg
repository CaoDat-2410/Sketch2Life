  <use href="#person" x="54" y="560" width="40" height="48"/><text x="36" y="624" class="small">Super Admin</text>
  <rect x="132" y="550" width="310" height="104" class="soft-box"/>
  <use href="#monitor" x="145" y="580" width="42" height="36"/>
  <text x="196" y="584" class="heading">Admin surface</text>
  <text x="196" y="608" class="body">Administration and governance</text>
  <text x="196" y="631" class="tbd">UI FRAMEWORK TBD</text>
  <path d="M95 598H132" class="flow"/>

  <!-- backend system boundary -->
  <rect x="490" y="128" width="914" height="976" class="boundary"/>
  <rect x="506" y="116" width="250" height="24" fill="#fff"/>
  <text x="512" y="134" class="section">SKETCH2LIFE BACKEND</text>

  <!-- three client paths enter the same API boundary -->
  <path d="M442 302H470V342H520" class="flow"/>
  <path d="M442 452H520" class="flow"/>
  <path d="M442 602H478V562H520" class="flow"/>
  <text x="454" y="440" class="tiny">HTTPS</text>

  <rect x="520" y="276" width="180" height="352" class="confirmed-box"/>
  <use href="#server" x="581" y="300" width="48" height="48"/>
