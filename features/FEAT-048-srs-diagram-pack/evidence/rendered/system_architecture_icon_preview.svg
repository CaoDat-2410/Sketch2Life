  <rect x="1430" y="730" width="372" height="374" class="external-boundary"/>
  <rect x="1446" y="718" width="230" height="24" fill="#fff"/>
  <text x="1452" y="736" class="section">EXTERNAL CAPABILITIES</text>
  <text x="1452" y="766" class="small">Vendor/provider undecided.</text>

  <rect x="520" y="745" width="854" height="346" class="soft-box"/>
  <use href="#adapter" x="538" y="756" width="31" height="31"/>
