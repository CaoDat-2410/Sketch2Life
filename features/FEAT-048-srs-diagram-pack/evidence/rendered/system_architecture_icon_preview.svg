<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1210" viewBox="0 0 1840 1210" role="img" aria-labelledby="title desc">
  <title id="title">Sketch2Life system architecture — revised preview</title>
  <desc id="desc">A conventional software architecture diagram with actors and clients, a Sketch2Life backend boundary, application and domain components, outbound ports, proposed adapters, and external capabilities.</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#42566b"/></marker>
    <marker id="arrProposed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#9a7837"/></marker>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#263544}
      .title{font-size:27px;font-weight:650}
      .subtitle{font-size:13px;fill:#667482}
      .boundary{fill:none;stroke:#526578;stroke-width:1.6;stroke-dasharray:7 5}
      .external-boundary{fill:none;stroke:#8c8064;stroke-width:1.4;stroke-dasharray:6 5}
      .box{fill:#fff;stroke:#536577;stroke-width:1.35}
      .confirmed-box{fill:#fff;stroke:#4d8266;stroke-width:1.6}
      .soft-box{fill:#fff;stroke:#9aa5af;stroke-width:1.1}
      .candidate-box{fill:#fff;stroke:#8c8064;stroke-width:1.15}
      .section{font-size:12px;font-weight:700;letter-spacing:.75px;fill:#526273}
      .heading{font-size:16px;font-weight:650}
      .body{font-size:12px;fill:#465564}
      .small{font-size:11px;fill:#667482}
      .tiny{font-size:10px;fill:#78838d}
      .confirmed{font-size:10px;font-weight:700;letter-spacing:.45px;fill:#347253}
      .proposed{font-size:10px;font-weight:700;letter-spacing:.4px;fill:#8d6c2b}
      .tbd{font-size:10px;font-weight:700;letter-spacing:.4px;fill:#6f7c87}
      .flow{fill:none;stroke:#42566b;stroke-width:1.6;marker-end:url(#arr)}
      .flow-proposed{fill:none;stroke:#9a7837;stroke-width:1.4;stroke-dasharray:6 4;marker-end:url(#arrProposed)}
      .divider{stroke:#d6dce1;stroke-width:1}
      .icon{fill:none;stroke:#42566b;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
      .icon-green{fill:none;stroke:#347253;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
      .icon-candidate{fill:none;stroke:#8d6c2b;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
      .list{font-size:11.5px;fill:#465564}
    </style>
