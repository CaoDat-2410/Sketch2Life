  <rect width="1840" height="1210" fill="#fff"/>
  <text x="38" y="49" class="title">Sketch2Life — System Architecture</text>
  <text x="39" y="74" class="subtitle">System overview · SRS v3.1 · B8 / B19 / B21</text>
