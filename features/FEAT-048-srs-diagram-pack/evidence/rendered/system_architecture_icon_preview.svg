  <path d="M1038 698V745" class="flow"/>
  <text x="1050" y="724" class="tiny">runtime call</text>
  <path d="M1340 745V720H1390V650H1374" class="flow-proposed"/>
  <text x="1224" y="714" class="tiny">adapter implements port contract</text>

  <rect x="538" y="795" width="818" height="42" class="soft-box"/>
  <text x="554" y="821" class="body">Persistence adapter</text><text x="1310" y="821" text-anchor="end" class="proposed">PROPOSED</text>
  <rect x="538" y="844" width="818" height="42" class="soft-box"/>
  <text x="554" y="870" class="body">Artifact adapter</text><text x="1310" y="870" text-anchor="end" class="proposed">PROPOSED</text>
  <rect x="538" y="893" width="818" height="42" class="soft-box"/>
  <text x="554" y="919" class="body">Job / queue adapter</text><text x="1310" y="919" text-anchor="end" class="proposed">PROPOSED</text>
  <rect x="538" y="942" width="818" height="42" class="soft-box"/>
  <text x="554" y="968" class="body">Adult identity adapter</text><text x="1310" y="968" text-anchor="end" class="proposed">PROPOSED</text>
