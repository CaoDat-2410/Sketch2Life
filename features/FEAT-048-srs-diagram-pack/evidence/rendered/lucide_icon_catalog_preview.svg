<svg xmlns="http://www.w3.org/2000/svg" width="1648" height="1000" viewBox="0 0 1648 1000" role="img" aria-labelledby="title desc">
  <title id="title">Lucide icon catalog preview for Sketch2Life System Architecture</title>
  <desc id="desc">Fifteen individually labeled Lucide-style line icons mapped to system architecture roles. This is a preview sheet only.</desc>
