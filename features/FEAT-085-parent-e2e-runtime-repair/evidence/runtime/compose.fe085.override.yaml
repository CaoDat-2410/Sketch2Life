services:
  postgres:
    ports: !override []
  redis:
    ports: !override []
  minio:
    ports: !override []
  clamav:
    ports: !override []
  api:
    image: sketch2life-parent-e2e-fe085:20261123
    container_name: fe085-parent-api-20261123
    environment:
      SKETCH2LIFE_ENV: local
      SKETCH2LIFE_API_HOST: 0.0.0.0
      SKETCH2LIFE_API_PORT: 8000
      SKETCH2LIFE_S3_ENDPOINT: http://minio:9000
      SKETCH2LIFE_CLAMAV_HOST: clamav
      SKETCH2LIFE_AI_PROVIDER: modal_dev
      MODAL_ENVIRONMENT: dev
      FIREBASE_AUTH_EMULATOR_HOST: ""
    ports: !override
      - "127.0.0.1:18001:8000"
    restart: unless-stopped
