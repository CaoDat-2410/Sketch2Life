packages:
  - "apps/mobile"
  - "apps/ui-mobile"
  - "packages/art-renderer"
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
patchedDependencies:
  expo-av@15.0.2: patches/expo-av@15.0.2.patch

# The legacy apps/ui-mobile Expo SDK 52 project needs its Metro 0.81 graph isolated
# from the active apps/mobile Expo SDK 58 / React Native 0.88 graph.
packageExtensions:
  "@expo/metro-config@0.19.12":
    dependencies:
      metro-cache: 0.81.5
      metro-config: 0.81.5
